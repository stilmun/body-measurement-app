<!DOCTYPE html>
<html>
<head>
    <title>Upload Your Video</title>
</head>
<body>
    <h2>Upload a video to analyze your body measurements</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>Video File:</label><br>
        <input type="file" name="video" required><br><br>
        <label>Your Height (cm):</label><br>
        <input type="number" name="height_cm" step="0.1" required><br><br>
        <input type="submit" value="Analyze">
    </form>
</body>
</html>
